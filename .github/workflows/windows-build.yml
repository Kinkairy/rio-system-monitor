name: Build RIO Windows Qt
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile Qt single file
        run: python -m PyInstaller --noconfirm --clean RIO-System-Monitor.spec
      - name: Capture real packaged Qt windows and test lifecycle
        env:
          QT_QUICK_BACKEND: software
        run: |
          $p = Start-Process -FilePath .\dist\RIO-System-Monitor-Qt.exe -ArgumentList '--ui-capture', 'qt-capture', '--self-test' -PassThru
          if (!$p.WaitForExit(120000)) { throw 'Qt smoke did not finish in 120 seconds' }
          if ($p.ExitCode -ne 0) { throw "Qt executable exited $($p.ExitCode)" }
          if (!(Test-Path qt-capture/qt-proof.json)) { throw 'Qt UI verification did not complete' }
      - uses: actions/upload-artifact@v4
        with:
          name: RIO-System-Monitor-Qt-Windows
          path: |
            dist/RIO-System-Monitor-Qt.exe
            qt-capture/*
            bundle-pruning.json
          retention-days: 7
