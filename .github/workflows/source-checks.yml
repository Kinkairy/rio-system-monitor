name: Source checks
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public source boundary
        run: python tools/check_source_only.py
      - name: Install source test dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Source tests (private-art tests explicitly skipped)
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      # No private asset checkout, screenshots, packaged EXE, or public artifacts.
